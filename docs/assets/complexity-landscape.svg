<text x="40" y="492">Weighted correction</text><text x="430" y="492" class="r" font-weight="700">NP-hard general</text><text x="650" y="492">tree / bounded tw tractable</text><text x="930" y="492">exact min-sum DP</text></g><text x="40" y="545" class="s" fill="#6B747C">Key boundary: local witness checking is tractable; selecting one globally coherent interpretation is hard in general.</text></svg>